data:
  root: data/chest_xray
  img_size: 384
  batch_size: 32
  num_workers: 4

model:
  name: resnet18
  pretrained: true

training:
  epochs: 15
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  pos_weight: 1.5   # used in BCEWithLogitsLoss

eval:
  target_sensitivity: 0.90
  save_dir: outputs/baseline_resnet18
  seed: 42